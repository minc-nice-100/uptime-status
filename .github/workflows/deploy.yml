name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ] # 根据你的主分支名称修改（可能是 master）

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 允许工作流写入仓库

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 根据你的需要调整版本

      - name: Install dependencies
        run: npm i --unsafe-perm=true

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # 根据你的构建输出目录修改（可能是 build, docs, public 等）
