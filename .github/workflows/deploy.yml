name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --unsafe-perm=true # 使用 ci 替代 i 保持依赖一致性

      - name: Build project
        run: |
          npm run build
          ls -la dist/ # 显式检查目录

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ dist 目录不存在!"
            exit 1
          fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true # 保留 gh-pages 分支现有文件
